name: Build & Release APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.1}"
          cp app/build/outputs/apk/release/app-release.apk "dist/kuro-launcher-${TAG_NAME}.apk" || cp app/build/outputs/apk/release/*.apk dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuro-launcher-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
